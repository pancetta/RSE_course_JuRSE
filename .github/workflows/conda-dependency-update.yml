name: Conda Dependency Update

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        micromamba-version: 'latest'
        # Start with minimal environment for the update script
        environment-name: update-env
        create-args: >-
          python>=3.7
          conda-forge::conda-lock
    
    - name: Create conda-lock files for reproducibility
      run: |
        echo "Creating conda-lock files for all environments..."
        
        # Create lock file for the unified environment
        conda-lock lock --file environment.yml --platform linux-64 --lockfile environment-linux-64.lock
      shell: bash -el {0}
    
    - name: Test updated environment with current CI checks
      run: |
        # Create a fresh test environment from the updated lock files
        conda-lock install --prefix $MAMBA_ROOT_PREFIX/envs/test-env environment-linux-64.lock

        # Run the same checks as CI using 'micromamba run' to target the test environment
        echo "=== Checking formatting with black ==="
        micromamba run -n test-env black --check .

        echo "=== Linting with ruff ==="
        micromamba run -n test-env ruff check .

        echo "=== Checking Python syntax ==="
        micromamba run -n test-env python -m py_compile scripts/convert_to_notebooks.py
        for lecture_file in lecture_*/lecture_*.py; do
          echo "Checking syntax: $lecture_file"
          micromamba run -n test-env python -m py_compile "$lecture_file"
        done

        echo "=== Converting lectures to notebooks ==="
        micromamba run -n test-env python scripts/convert_to_notebooks.py

        echo "=== Executing notebooks to verify they run ==="
        for lecture_file in lecture_*/lecture_*.py; do
          notebook_file="${lecture_file%.py}.ipynb"
          echo "Executing: $notebook_file"
          micromamba run -n test-env jupyter nbconvert --to notebook --execute --inplace "$notebook_file" || {
            echo "ERROR: Failed to execute $notebook_file"
            exit 1
          }
        done

        echo "✅ All tests passed with updated dependencies!"
      shell: bash -el {0}
    
    - name: Commit and push lock files if tests passed
      id: commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if there are changes
        if [[ -n $(git status --porcelain) ]]; then
          git checkout -b automated-conda-dependency-update
          git add environment-linux-64.lock
          git commit -m "chore: update conda lock files with latest compatible versions

          This automated update was tested and verified to pass all CI checks."
          git push origin automated-conda-dependency-update --force
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Branch 'automated-conda-dependency-update' has been pushed. Please open a pull request to merge the dependency updates."
        else
          echo "No dependency updates available"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
