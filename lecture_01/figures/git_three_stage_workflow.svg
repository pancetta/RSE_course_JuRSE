<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the Git three-stage workflow: a file moves from the Working Directory to the Staging Area via git add, then to the Repository via git commit, with git checkout able to restore it back to the working directory.">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="298" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="380" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">The Git Three-Stage Workflow</text>

  <!-- Working Directory -->
  <rect x="40" y="90" width="190" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Working Directory</text>
  <text x="135" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">where you edit files</text>
  <rect x="49" y="158" width="172" height="26" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="135" y="175" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#1e3a8a">analysis.py (modified)</text>

  <!-- Staging Area -->
  <rect x="285" y="90" width="190" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Staging Area</text>
  <text x="380" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">what git status shows staged</text>
  <rect x="294" y="158" width="172" height="26" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="380" y="175" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9a3412">analysis.py (staged)</text>

  <!-- Repository -->
  <rect x="530" y="90" width="190" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Repository (.git)</text>
  <text x="625" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">what git log remembers</text>
  <rect x="539" y="158" width="172" height="26" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="625" y="175" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#14532d">analysis.py (committed)</text>

  <!-- Arrow 1: add; label sits above the boxes since the 55px gap is too narrow for "git add" at any reasonable size -->
  <line x1="230" y1="145" x2="280" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="255" y="74" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#334155">git add</text>
  <line x1="255" y1="80" x2="255" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Arrow 2: commit; same reasoning -->
  <line x1="475" y1="145" x2="525" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="500" y="74" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#334155">git commit</text>
  <line x1="500" y1="80" x2="500" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Dashed return arrow: checkout/restore -->
  <path d="M 625 200 C 625 250, 135 250, 135 205" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <text x="380" y="268" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#64748b">git restore / git checkout -- file  (go back to a previous state)</text>
</svg>
