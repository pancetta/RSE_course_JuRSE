<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing your computer and a collaborator's computer, each with their own local Git repository, both pushing to and pulling from a single shared GitHub repository.">
  <defs>
    <marker id="lvrArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="418" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Local Repositories vs. the Shared Remote</text>

  <!-- GitHub box, top center -->
  <rect x="290" y="66" width="200" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">GitHub</text>
  <text x="390" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">Remote Repository</text>
  <text x="390" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#166534">the shared source of truth</text>

  <!-- Your Computer -->
  <rect x="50" y="260" width="230" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Your Computer</text>
  <text x="165" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e40af">Local Repository</text>
  <text x="165" y="328" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e40af">(.git folder)</text>
  <text x="165" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#334155">evolves independently until synced</text>

  <!-- Collaborator's Computer -->
  <rect x="500" y="260" width="230" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="615" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Collaborator</text>
  <text x="615" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a3412">Local Repository</text>
  <text x="615" y="328" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#9a3412">(.git folder)</text>
  <text x="615" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#334155">their own independent copy</text>

  <!-- push/pull You <-> GitHub -->
  <line x1="225" y1="258" x2="335" y2="156" stroke="#2563eb" stroke-width="2.2" marker-end="url(#lvrArrow)"/>
  <text x="235" y="210" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#1e3a8a">git push</text>
  <line x1="315" y1="156" x2="205" y2="258" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#lvrArrow)"/>
  <text x="130" y="240" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#64748b">git pull</text>

  <!-- push/pull Collaborator <-> GitHub -->
  <line x1="555" y1="258" x2="445" y2="156" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#lvrArrow)"/>
  <text x="465" y="210" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#64748b">git pull</text>
  <line x1="465" y1="156" x2="575" y2="258" stroke="#ea580c" stroke-width="2.2" marker-end="url(#lvrArrow)"/>
  <text x="600" y="240" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#9a3412">git push</text>

  <text x="390" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Committing changes locally does not send them anywhere — only git push and git pull move work between repositories.</text>
</svg>
