<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a Git merge conflict: the HEAD marker through the divider is your branch's version, the divider through the end marker is the incoming branch's version, and the resolution below keeps the rename and adds back the docstring before removing all marker lines.">
  <rect x="1" y="1" width="778" height="478" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Anatomy of a Merge Conflict</text>

  <!-- code card -->
  <rect x="40" y="56" width="700" height="216" rx="10" fill="#0f172a"/>

  <!-- blue band: your changes -->
  <rect x="56" y="66" width="420" height="94" rx="4" fill="#1e3a8a" opacity="0.55"/>
  <!-- orange band: their changes -->
  <rect x="56" y="186" width="420" height="70" rx="4" fill="#9a3412" opacity="0.55"/>

  <text x="64" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#93c5fd">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (your changes)</text>
  <text x="64" y="108" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0">def calculate_temperature(kelvin):</text>
  <text x="64" y="132" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#bbf7d0">    """Convert Kelvin to Celsius."""</text>
  <text x="64" y="156" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0">    return kelvin - 273.15</text>
  <text x="64" y="180" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#cbd5e1">=======</text>
  <text x="64" y="204" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0">def calculate_temperature_celsius(kelvin):</text>
  <text x="64" y="228" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0">    return kelvin - 273.15</text>
  <text x="64" y="252" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#fdba74">&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main (their changes)</text>

  <!-- callouts -->
  <line x1="500" y1="80" x2="486" y2="80" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="504" y="78" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">start marker</text>
  <text x="504" y="91" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">everything below is your current branch</text>

  <line x1="500" y1="176" x2="486" y2="176" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="504" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">divider</text>
  <text x="504" y="187" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">separates the two competing versions</text>

  <line x1="500" y1="248" x2="486" y2="248" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="504" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">end marker</text>
  <text x="504" y="235" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">everything above (since the divider)</text>
  <text x="504" y="248" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">is the incoming branch</text>

  <line x1="20" y1="296" x2="760" y2="296" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,4"/>
  <text x="390" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">Resolution: keep the rename, keep the docstring, delete all three markers</text>

  <rect x="40" y="332" width="700" height="112" rx="10" fill="#0f172a"/>
  <rect x="56" y="342" width="500" height="92" rx="4" fill="#166534" opacity="0.55"/>
  <text x="64" y="362" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#bbf7d0">def calculate_temperature_celsius(kelvin):</text>
  <text x="64" y="386" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#bbf7d0">    """Convert temperature from Kelvin to Celsius."""</text>
  <text x="64" y="410" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#bbf7d0">    return kelvin - 273.15</text>

  <text x="390" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">git add the resolved file, then git commit — Git knows the conflict is resolved once no markers remain.</text>
</svg>
