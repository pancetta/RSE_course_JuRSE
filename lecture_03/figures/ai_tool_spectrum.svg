<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spectrum of AI coding tools from autocomplete-style through chat-style to agentic, showing that visibility into what the tool did decreases while the review effort required from the developer increases.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="778" height="318" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Three Categories of AI Coding Tools</text>

  <!-- three stage boxes -->
  <rect x="40" y="66" width="210" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Autocomplete-style</text>
  <text x="145" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">suggests the next line</text>
  <text x="145" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">as you type</text>
  <text x="145" y="152" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#14532d">Copilot · Tabnine</text>
  <text x="145" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#166534">you review each suggestion</text>

  <rect x="285" y="66" width="210" height="120" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="390" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Chat-style</text>
  <text x="390" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a3412">you ask, it drafts a</text>
  <text x="390" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a3412">snippet in conversation</text>
  <text x="390" y="152" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#9a3412">ChatGPT · Claude · Gemini</text>
  <text x="390" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#9a3412">you review a self-contained block</text>

  <rect x="530" y="66" width="210" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Agentic</text>
  <text x="635" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#991b1b">plans and executes: edits</text>
  <text x="635" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#991b1b">files, runs commands, opens a PR</text>
  <text x="635" y="152" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#991b1b">Claude Code · Cursor agent mode</text>
  <text x="635" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#991b1b">you review a diff you didn't watch get written</text>

  <!-- connecting arrows -->
  <line x1="250" y1="126" x2="280" y2="126" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="495" y1="126" x2="525" y2="126" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- trend bar -->
  <text x="40" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Review effort required, as autonomy increases →</text>
  <rect x="40" y="234" width="700" height="16" rx="8" fill="url(#riskGrad)"/>
  <line x1="40" y1="252" x2="40" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="390" y1="252" x2="390" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="740" y1="252" x2="740" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="278" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">low — line-by-line</text>
  <text x="390" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">medium — snippet-by-snippet</text>
  <text x="740" y="278" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">high — diff you didn't watch happen</text>

  <text x="390" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Same habit applies everywhere: treat every suggestion as a diff someone else wrote.</text>
</svg>
