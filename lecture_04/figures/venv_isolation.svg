<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before and after comparison: installing packages globally causes a version conflict between two projects, while giving each project its own virtual environment lets them use different, incompatible package versions safely.">
  <defs>
    <marker id="veiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="378" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Why Virtual Environments</text>

  <text x="180" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Without: one global Python</text>

  <rect x="60" y="76" width="240" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f1d1d">Global Python install</text>
  <text x="180" y="126" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#7f1d1d">Project A needs numpy 1.19</text>
  <text x="180" y="146" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#7f1d1d">Project B needs numpy 1.21</text>
  <text x="180" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">✗ only one can be installed</text>
  <text x="180" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#991b1b">the other project breaks</text>

  <line x1="380" y1="140" x2="430" y2="140" stroke="#475569" stroke-width="2.2" marker-end="url(#veiArrow)"/>

  <text x="600" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">With: one venv per project</text>

  <rect x="440" y="76" width="150" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">venv: Project A</text>
  <text x="515" y="126" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e40af">numpy 1.19</text>
  <text x="515" y="144" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e40af">matplotlib 3.3</text>
  <text x="515" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#16a34a">✓</text>

  <rect x="600" y="76" width="150" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="675" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">venv: Project B</text>
  <text x="675" y="126" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e40af">numpy 1.21</text>
  <text x="675" y="144" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e40af">matplotlib 3.6</text>
  <text x="675" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#16a34a">✓</text>

  <text x="600" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#166534">both work — fully isolated</text>

  <rect x="440" y="230" width="310" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="595" y="252" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#334155">python -m venv myenv &amp;&amp; source myenv/bin/activate</text>

  <text x="390" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Delete the environment folder and every trace of its packages goes with it — no system-wide cleanup needed.</text>
</svg>
