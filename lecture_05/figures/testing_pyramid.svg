<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Testing pyramid with many fast unit tests at the base, fewer integration tests in the middle, and few slow acceptance tests at the top; regression tests apply at every level.">
  <rect x="1" y="1" width="698" height="398" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">The Testing Pyramid</text>

  <polygon points="280,90 420,90 480,170 220,170" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Acceptance tests</text>
  <text x="350" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#991b1b">few — whole system, slowest</text>

  <polygon points="220,180 480,180 560,260 140,260" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="350" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Integration tests</text>
  <text x="350" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a3412">some — components working together</text>

  <polygon points="140,270 560,270 650,350 50,350" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d">Unit tests</text>
  <text x="350" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#166534">many — one function each, fast</text>
  <text x="350" y="336" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#166534">e.g. test_celsius_to_fahrenheit_freezing</text>

  <text x="350" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">+ Regression tests apply at every level — they re-check that old bugs don't come back.</text>
</svg>
