<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Branching flowchart comparing the same buggy commit without CI, where the bug reaches production and the paper is later retracted, versus with CI, where tests fail immediately, the pull request is blocked, and the developer fixes the bug before it causes harm.">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="458" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Without CI vs. With CI</text>

  <!-- start box -->
  <rect x="260" y="52" width="240" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="380" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Developer writes buggy code, commits &amp; pushes</text>

  <!-- diagonals -->
  <line x1="320" y1="98" x2="180" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="98" x2="580" y2="140" stroke="#94a3b8" stroke-width="2"/>

  <text x="180" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Without CI</text>
  <text x="580" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">With CI</text>

  <!-- LEFT column: no CI -->
  <rect x="70" y="140" width="220" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">Bug reaches main branch</text>

  <line x1="180" y1="192" x2="180" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="70" y="222" width="220" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">Incorrect results published</text>

  <line x1="180" y1="274" x2="180" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="60" y="304" width="240" height="66" rx="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="180" y="331" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Paper retracted</text>
  <text x="180" y="349" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fecaca">months later</text>

  <!-- RIGHT column: CI -->
  <rect x="470" y="140" width="220" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#14532d">CI automatically runs tests</text>

  <line x1="580" y1="192" x2="580" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="470" y="212" width="220" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">Tests FAIL ✗</text>
  <text x="580" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#166534">bug detected immediately</text>

  <line x1="580" y1="264" x2="580" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="470" y="284" width="220" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="311" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#14532d">PR blocked from merging</text>

  <line x1="580" y1="329" x2="580" y2="349" stroke="#475569" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="460" y="349" width="240" height="66" rx="8" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <text x="580" y="376" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Developer fixes bug</text>
  <text x="580" y="394" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#dcfce7">crisis averted ✓</text>

  <text x="380" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Same bug, same commit — the only difference is whether a test suite ran automatically before it could spread.</text>
</svg>
