<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The documentation-to-citation toolchain: docstrings feed Sphinx, which generates a site hosted on Read the Docs, while the package is published to PyPI, archived on Zenodo for a DOI, and optionally submitted to JOSS.">
  <defs>
    <marker id="dpcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="258" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="400" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">From Docstrings to a Citable DOI</text>

  <rect x="24" y="80" width="108" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Docstrings</text>
  <text x="78" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">NumPy-style,</text>
  <text x="78" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">in the code</text>

  <line x1="132" y1="118" x2="156" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#dpcArrow)"/>

  <rect x="158" y="80" width="108" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="212" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Sphinx</text>
  <text x="212" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b21b6">autodoc builds</text>
  <text x="212" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b21b6">the HTML site</text>

  <line x1="266" y1="118" x2="290" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#dpcArrow)"/>

  <rect x="292" y="80" width="112" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="348" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9a3412">Read the Docs</text>
  <text x="348" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9a3412">hosts the site,</text>
  <text x="348" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9a3412">rebuilds on push</text>

  <line x1="404" y1="118" x2="428" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#dpcArrow)"/>

  <rect x="430" y="80" width="98" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="479" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14532d">PyPI</text>
  <text x="479" y="122" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#166534">pip install</text>
  <text x="479" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#166534">package</text>

  <line x1="528" y1="118" x2="552" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#dpcArrow)"/>

  <rect x="554" y="80" width="112" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">Zenodo</text>
  <text x="610" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#991b1b">GitHub release →</text>
  <text x="610" y="134" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#991b1b">10.5281/zenodo…</text>

  <line x1="666" y1="118" x2="690" y2="118" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dpcArrow)"/>

  <rect x="692" y="80" width="90" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="737" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">JOSS</text>
  <text x="737" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#334155">optional —</text>
  <text x="737" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#334155">peer-reviewed</text>

  <text x="400" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Each arrow is a one-time setup step — after that, pushing to GitHub keeps every stage current automatically.</text>
  <text x="400" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">README and LICENSE feed the whole chain from the start — they're what makes the rest worth building.</text>
</svg>
