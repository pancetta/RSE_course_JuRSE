<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side-by-side architecture comparison: virtual machines stack a full guest operating system under every app on top of a hypervisor, while containers share one host kernel through a container runtime and skip the guest OS layer entirely, making them far lighter and faster to start.">
  <rect x="1" y="1" width="778" height="458" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Virtual Machines vs. Containers</text>

  <text x="205" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e3a8a">Virtual Machines</text>
  <text x="575" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14532d">Containers</text>

  <!-- ===== VM column ===== -->
  <!-- 3 instances: guest OS + app -->
  <g>
    <rect x="36" y="180" width="108" height="104" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="40" y="232" width="100" height="48" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">Guest OS</text>
    <rect x="40" y="184" width="100" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">App A</text>

    <rect x="151" y="180" width="108" height="104" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="155" y="232" width="100" height="48" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="205" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">Guest OS</text>
    <rect x="155" y="184" width="100" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="205" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">App B</text>

    <rect x="266" y="180" width="108" height="104" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="270" y="232" width="100" height="48" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="320" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">Guest OS</text>
    <rect x="270" y="184" width="100" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">App C</text>
  </g>

  <rect x="40" y="280" width="330" height="45" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="205" y="307" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#312e81">Hypervisor</text>

  <rect x="40" y="325" width="330" height="45" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="205" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Host OS</text>

  <rect x="40" y="370" width="330" height="40" fill="#334155"/>
  <text x="205" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Hardware</text>

  <text x="205" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">full guest OS per app</text>
  <text x="205" y="443" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">heavy (GBs) · slow startup (minutes)</text>

  <!-- ===== Container column ===== -->
  <g>
    <rect x="406" y="221" width="108" height="63" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="410" y="225" width="100" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="460" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#14532d">App A</text>

    <rect x="521" y="221" width="108" height="63" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="525" y="225" width="100" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="575" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#14532d">App B</text>

    <rect x="636" y="221" width="108" height="63" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="640" y="225" width="100" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="690" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#14532d">App C</text>
  </g>

  <rect x="410" y="280" width="330" height="45" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="303" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14532d">Container Runtime</text>
  <text x="575" y="316" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#14532d">(Docker / Podman)</text>

  <rect x="410" y="325" width="330" height="45" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="575" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Host OS</text>

  <rect x="410" y="370" width="330" height="40" fill="#334155"/>
  <text x="575" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Hardware</text>

  <text x="575" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#166534">no guest OS — shares the host kernel</text>
  <text x="575" y="443" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#166534">lightweight (MBs) · fast startup (seconds)</text>
</svg>
