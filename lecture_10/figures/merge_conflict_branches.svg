<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A merge conflict arising on a branch graph: your feature branch adds a docstring while a colleague's branch, merged first, renames the same function; merging your branch into the updated main hits a conflict on that function, resolved by keeping both the rename and the docstring.">
  <defs>
    <marker id="mcbArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="418" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">How a Merge Conflict Happens</text>

  <!-- main line -->
  <line x1="80" y1="220" x2="700" y2="220" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="80" cy="220" r="16" fill="#475569"/>
  <text x="80" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C1</text>

  <!-- colleague branch (upper), merges first into main -->
  <line x1="80" y1="220" x2="260" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="260" cy="120" r="16" fill="#ea580c"/>
  <text x="260" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C2</text>
  <text x="260" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9a3412">colleague's branch</text>
  <text x="260" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9a3412">renames the function</text>

  <line x1="260" y1="120" x2="380" y2="220" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="380" cy="220" r="16" fill="#ea580c"/>
  <text x="380" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C3</text>
  <text x="380" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">merged first — main now has the rename</text>

  <!-- your branch (lower) -->
  <line x1="80" y1="220" x2="260" y2="320" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="260" cy="320" r="16" fill="#2563eb"/>
  <text x="260" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C4</text>
  <text x="260" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">your branch</text>
  <text x="260" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">adds a docstring, same function</text>

  <!-- attempted merge -->
  <line x1="380" y1="220" x2="560" y2="220" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="260" y1="320" x2="560" y2="220" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="560" cy="220" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="560" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626">✗</text>
  <text x="560" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">conflict — same function,</text>
  <text x="560" y="202" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">two edits</text>

  <line x1="580" y1="220" x2="640" y2="220" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mcbArrow)"/>

  <circle cx="670" cy="220" r="20" fill="#16a34a"/>
  <text x="670" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">C5</text>
  <text x="670" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534">resolved: keep the</text>
  <text x="670" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534">rename + the docstring</text>

  <text x="390" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Neither branch was wrong — they just touched the same lines. Resolving means combining both intents, not picking a winner.</text>
</svg>
