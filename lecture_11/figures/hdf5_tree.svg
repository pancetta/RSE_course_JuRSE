<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HDF5 file structure as a folder tree: climate_data.h5 contains a metadata group and two experiment groups, each experiment holding temperature and pressure datasets plus its own metadata.">
  <defs>
    <marker id="hdfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="418" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">HDF5: A File System Within a File</text>

  <!-- root -->
  <rect x="40" y="56" width="200" height="40" rx="8" fill="#334155"/>
  <text x="140" y="81" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">climate_data.h5</text>

  <line x1="60" y1="96" x2="60" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="120" x2="90" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#hdfArrow)"/>

  <!-- metadata group -->
  <rect x="94" y="108" width="180" height="76" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="184" y="128" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#4c1d95">/metadata</text>
  <text x="184" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b21b6">institution: "Max Planck..."</text>
  <text x="184" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b21b6">contact: "research@..."</text>
  <text x="184" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b21b6">created: "2026-01-15"</text>

  <line x1="60" y1="120" x2="60" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="222" x2="90" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#hdfArrow)"/>

  <!-- experiment_001 group -->
  <rect x="94" y="196" width="290" height="140" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="216" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#1e3a8a">/experiment_001</text>

  <rect x="110" y="226" width="258" height="26" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="239" y="243" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#1e3a8a">temperature [365, 180, 360]</text>

  <rect x="110" y="256" width="258" height="26" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="239" y="273" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#1e3a8a">pressure [365, 180, 360]</text>

  <rect x="110" y="286" width="258" height="40" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="239" y="301" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">metadata: description = "RCP8.5</text>
  <text x="239" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">scenario", units = {K, Pa}</text>

  <line x1="60" y1="222" x2="60" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="90" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#hdfArrow)"/>

  <!-- experiment_002 group, collapsed -->
  <rect x="94" y="344" width="290" height="34" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="112" y="365" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#334155">/experiment_002 …</text>

  <!-- side callouts -->
  <text x="500" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Groups</text>
  <text x="500" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b21b6">act like directories</text>

  <text x="500" y="245" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Datasets</text>
  <text x="500" y="261" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">act like files —</text>
  <text x="500" y="275" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">read a slice without</text>
  <text x="500" y="289" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">loading the whole array</text>

  <text x="350" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Every group and dataset can carry its own attributes — the file describes itself.</text>
</svg>
