<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automation maturity progression from a plain shell script through a smarter shell script, Make, to Snakemake, showing which of Elena's five problems each stage solves.">
  <defs>
    <marker id="amArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="418" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="400" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">From Shell Script to Workflow Manager</text>
  <text x="400" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">which of Elena's five problems does each stage actually solve?</text>

  <!-- 4 columns -->
  <rect x="24" y="66" width="176" height="300" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="112" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f1d1d">Plain shell script</text>
  <text x="112" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#991b1b">runs everything, every time</text>
  <line x1="40" y1="118" x2="184" y2="118" stroke="#dc2626" stroke-width="1"/>
  <text x="40" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7f1d1d">✗ restart from failure</text>
  <text x="40" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7f1d1d">✗ rerun only what changed</text>
  <text x="40" y="174" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7f1d1d">✗ parallel execution</text>
  <text x="40" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7f1d1d">✗ self-documenting</text>
  <text x="40" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#7f1d1d">✗ exact reproducibility</text>

  <line x1="204" y1="216" x2="228" y2="216" stroke="#475569" stroke-width="2.2" marker-end="url(#amArrow)"/>

  <rect x="232" y="66" width="176" height="300" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9a3412">Smarter shell script</text>
  <text x="320" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9a3412">adds file-existence checks</text>
  <line x1="248" y1="118" x2="392" y2="118" stroke="#ea580c" stroke-width="1"/>
  <text x="248" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">~ partial restart</text>
  <text x="248" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">~ skips existing files</text>
  <text x="248" y="174" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">✗ parallel execution</text>
  <text x="248" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">✗ self-documenting</text>
  <text x="248" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9a3412">gets unwieldy fast</text>

  <line x1="412" y1="216" x2="436" y2="216" stroke="#475569" stroke-width="2.2" marker-end="url(#amArrow)"/>

  <rect x="440" y="66" width="176" height="300" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="528" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Make</text>
  <text x="528" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">targets, prerequisites, recipes</text>
  <line x1="456" y1="118" x2="600" y2="118" stroke="#2563eb" stroke-width="1"/>
  <text x="456" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">✓ restart from failure</text>
  <text x="456" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">✓ timestamp-based rebuild</text>
  <text x="456" y="174" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">✓ make -j parallelism</text>
  <text x="456" y="192" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">~ Makefile as documentation</text>
  <text x="456" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">syntax gets cryptic ($@, $&lt;)</text>

  <line x1="620" y1="216" x2="644" y2="216" stroke="#475569" stroke-width="2.2" marker-end="url(#amArrow)"/>

  <rect x="648" y="66" width="128" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="712" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">Snakemake</text>
  <text x="712" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#166534">Python-like rules</text>
  <line x1="664" y1="118" x2="760" y2="118" stroke="#16a34a" stroke-width="1"/>
  <text x="664" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">✓ restart, rebuild</text>
  <text x="664" y="156" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">✓ parallel + cluster</text>
  <text x="664" y="174" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">✓ wildcards over</text>
  <text x="676" y="188" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">many inputs</text>
  <text x="664" y="206" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">✓ conda/container per rule</text>
  <text x="664" y="224" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">✓ --dag documents itself</text>

  <text x="400" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Each stage is a real option, not a dead end — most projects can stop at Make and be fine.</text>
</svg>
