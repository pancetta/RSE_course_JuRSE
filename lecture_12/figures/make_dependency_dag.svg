<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Directed acyclic graph of the Make pipeline: temperature.csv is downloaded, cleaned into temperature_clean.csv, which fans out in parallel into plots.png and statistics.txt, both of which feed into report.pdf.">
  <defs>
    <marker id="arrow12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="318" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="400" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The Make Dependency Graph</text>

  <line x1="12" y1="150" x2="48" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="28" y="138" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#64748b">download</text>
  <text x="28" y="147" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#64748b">_data.py</text>

  <!-- N1 -->
  <rect x="50" y="120" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="145" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#1e3a8a">temperature.csv</text>
  <text x="125" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e40af">data/raw/</text>

  <line x1="200" y1="150" x2="248" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="224" y="112" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#64748b">clean_data.py</text>

  <!-- N2 -->
  <rect x="250" y="120" width="160" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="145" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#4c1d95">temperature_clean.csv</text>
  <text x="330" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5b21b6">data/processed/</text>

  <!-- forks -->
  <line x1="410" y1="140" x2="458" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="452" y="105" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#64748b">plot_data.py</text>
  <line x1="410" y1="160" x2="458" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="452" y="202" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#64748b">compute_stats.py</text>

  <!-- N3a -->
  <rect x="460" y="70" width="140" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="93" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#14532d">plots.png</text>
  <text x="530" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#166534">results/</text>

  <!-- N3b -->
  <rect x="460" y="175" width="140" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="198" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#14532d">statistics.txt</text>
  <text x="530" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#166534">results/</text>

  <text x="530" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#64748b">independent — can run in parallel with make -j</text>

  <!-- joins -->
  <line x1="600" y1="105" x2="648" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <line x1="600" y1="195" x2="648" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="642" y="153" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#64748b">generate_report.py</text>

  <!-- N4 -->
  <rect x="650" y="120" width="130" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="715" y="153" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">report.pdf</text>

  <text x="400" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Each arrow is a Makefile recipe; make rebuilds only what's stale relative to its prerequisites' timestamps.</text>
</svg>
