<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline diagram showing five separated concerns: data loading, preprocessing, analysis, visualization, and export, with a callout showing that swapping the data source only requires changing the first box.">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="298" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Separation of Concerns: One File, One Job</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40"  y="100" width="116" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="98" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Data Access</text>
    <text x="98" y="150" text-anchor="middle" font-size="10" fill="#1e3a8a">data_loading.py</text>
    <text x="98" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1e40af">load CSV/DB/API</text>

    <rect x="192" y="100" width="116" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="250" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Validation</text>
    <text x="250" y="150" text-anchor="middle" font-size="10" fill="#4c1d95">preprocessing.py</text>
    <text x="250" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5b21b6">clean, check ranges</text>

    <rect x="344" y="100" width="116" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="402" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Analysis</text>
    <text x="402" y="150" text-anchor="middle" font-size="10" fill="#9a3412">analysis.py</text>
    <text x="402" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9a3412">compute anomalies</text>

    <rect x="496" y="100" width="116" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="554" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Presentation</text>
    <text x="554" y="150" text-anchor="middle" font-size="10" fill="#14532d">visualization.py</text>
    <text x="554" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#166534">plots, figures</text>

    <rect x="648" y="100" width="116" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="706" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Export</text>
    <text x="706" y="150" text-anchor="middle" font-size="10" fill="#334155">export.py</text>
    <text x="706" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#334155">reports, files</text>
  </g>

  <line x1="156" y1="145" x2="188" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <line x1="308" y1="145" x2="340" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <line x1="460" y1="145" x2="492" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <line x1="612" y1="145" x2="644" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <!-- callout: swap source -->
  <path d="M 98 190 L 98 234" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="18" y="236" width="160" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="98" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Swap only this box:</text>
  <text x="98" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#991b1b">CSV file → NASA satellite DB</text>

  <text x="480" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Everything downstream — validation, analysis, plots, export — stays untouched.</text>
</svg>
