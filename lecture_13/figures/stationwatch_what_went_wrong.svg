<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StationWatch before and after: originally two nearly-identical 80-line functions each reached into a differently-shaped dictionary, making a third instrument type take weeks to add; after the fix, both data shapes feed one shared calculate_statistics function.">
  <defs>
    <marker id="arrow13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow13g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="458" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">StationWatch: What Went Wrong — and the Fix</text>
  <text x="390" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Before: tight coupling, copy-pasted logic</text>

  <!-- top data boxes -->
  <rect x="50" y="64" width="230" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="82" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1e3a8a">weather_station dict</text>
  <text x="165" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">{lat, lon, temp}</text>

  <rect x="500" y="64" width="230" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="82" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1e3a8a">soil_moisture dict</text>
  <text x="615" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1e40af">{different shape}</text>

  <line x1="165" y1="106" x2="165" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#arrow13)"/>
  <line x1="615" y1="106" x2="615" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#arrow13)"/>

  <!-- top function boxes -->
  <rect x="50" y="146" width="230" height="54" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="169" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#7f1d1d">analyze_station()</text>
  <text x="165" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#991b1b">80 lines</text>

  <rect x="500" y="146" width="230" height="54" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="615" y="169" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#7f1d1d">analyze_soil_moisture()</text>
  <text x="615" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#991b1b">80 lines, copy-pasted</text>

  <line x1="280" y1="173" x2="500" y2="173" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="390" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#991b1b">nearly identical logic — copy-pasted, not shared</text>

  <rect x="140" y="212" width="500" height="46" rx="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="390" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">3rd instrument type?</text>
  <text x="390" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#fecaca">3 weeks to untangle instead of 3 days</text>

  <line x1="20" y1="272" x2="760" y2="272" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,4"/>
  <text x="390" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">After: one shared function, two callers</text>

  <!-- bottom data boxes -->
  <rect x="50" y="302" width="230" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="324" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e3a8a">weather_station dict</text>

  <rect x="500" y="302" width="230" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="615" y="324" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#1e3a8a">soil_moisture dict</text>

  <line x1="200" y1="338" x2="335" y2="384" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow13g)"/>
  <line x1="580" y1="338" x2="445" y2="384" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow13g)"/>

  <rect x="280" y="388" width="220" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="411" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#14532d">calculate_statistics(data)</text>
  <text x="390" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#166534">same shape in → same function out</text>
</svg>
