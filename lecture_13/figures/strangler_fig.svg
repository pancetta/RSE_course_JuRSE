<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The strangler fig pattern in three panels: new code starts small alongside the old code, grows to handle more while the old code shrinks, and eventually the old code is fully replaced.">
  <defs>
    <marker id="sfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="338" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The Strangler Fig Pattern</text>
  <text x="390" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">named for the fig that grows around its host tree until nothing of the host remains</text>

  <!-- Panel 1 -->
  <rect x="30" y="70" width="220" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">1. Start alongside</text>
  <rect x="55" y="110" width="170" height="150" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">old code</text>
  <rect x="55" y="230" width="60" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="85" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#14532d">new</text>
  <text x="140" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b">one small piece rewritten</text>

  <line x1="256" y1="180" x2="284" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#sfArrow)"/>

  <!-- Panel 2 -->
  <rect x="290" y="70" width="220" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">2. Grow, shrink</text>
  <rect x="315" y="110" width="170" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">old code</text>
  <text x="400" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">shrinking</text>
  <rect x="315" y="200" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14532d">new code</text>
  <text x="400" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b">both run in production, tested</text>

  <line x1="516" y1="180" x2="544" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#sfArrow)"/>

  <!-- Panel 3 -->
  <rect x="550" y="70" width="200" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">3. Fully replaced</text>
  <rect x="575" y="110" width="150" height="16" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="650" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#94a3b8">old code — removed</text>
  <rect x="575" y="136" width="150" height="124" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="202" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">new code</text>
  <text x="650" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b">host tree gone, fig remains</text>

  <text x="390" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">The system stays shippable at every step — unlike a rewrite, there's never a moment nothing works.</text>
</svg>
