<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI generates code that matches patterns it has seen, but the RSE still has to verify it: does the normalization match the dataset, does the test verify real behavior, is the root cause fixed rather than the symptom silenced, and does the docstring match behavior at the boundaries.">
  <defs>
    <marker id="absArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="378" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">AI Shifts the Bottleneck</text>

  <!-- left: AI generates -->
  <rect x="40" y="70" width="220" height="230" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">AI generates code</text>
  <text x="150" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">matches patterns it has</text>
  <text x="150" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">seen before</text>
  <text x="150" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">⚡</text>
  <text x="150" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">fast, and getting faster —</text>
  <text x="150" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">no longer the bottleneck</text>

  <line x1="264" y1="185" x2="316" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#absArrow)"/>
  <text x="290" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" transform="rotate(0 290 168)">bottleneck</text>
  <text x="290" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155">shifts here</text>

  <!-- right: RSE verifies -->
  <rect x="320" y="70" width="420" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="530" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">The RSE verifies</text>
  <text x="530" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">"can someone tell whether the code is right?"</text>

  <text x="342" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">•  Does the normalization match this dataset?</text>
  <text x="620" y="150" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">L3</text>

  <text x="342" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">•  Does the test verify real behavior?</text>
  <text x="620" y="180" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">L5</text>

  <text x="342" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">•  Root cause fixed, or symptom silenced?</text>
  <text x="620" y="210" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">L7</text>

  <text x="342" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">•  Does the docstring match behavior at the</text>
  <text x="358" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">boundaries?</text>
  <text x="620" y="256" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">L8</text>

  <text x="530" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#1e40af">domain knowledge and judgment — what AI doesn't have</text>

  <text x="390" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">RSE skills aren't less valuable because AI writes code faster — they're more valuable, because someone still has to know if it's right.</text>
</svg>
